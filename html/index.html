<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cfx-nui-kora_theme/theme.css" />
  <!-- A loadscreen is shown before other resources are mounted, so the cfx-nui-kora_theme
       URLs may not answer yet. kora_theme/ holds synced copies of kora_theme's script,
       theme.json and fonts/ folder (see tools/sync-theme.mjs) so the same colour tokens
       AND the same font files apply from this resource's own files; the live script
       below re-applies them once reachable. The local fonts.css is linked after
       theme.css (which @imports the kora_theme copy) so these local @font-face rules
       win and no font is fetched across the NUI origin while the page is on screen. -->
  <link rel="stylesheet" href="kora_theme/fonts/fonts.css" />
  <script src="kora_theme/theme.js" defer></script>
  <script src="https://cfx-nui-kora_theme/theme.js?v=4" defer></script>
  <title>Loading</title>
  <!-- Cache-busting query strings: FiveM's NUI browser (CEF) can serve a
       stale cached copy of these files across reconnects/restarts,
       independent of the server-side resource actually updating -- bump
       this value on every change to html/app.js or html/style.css. -->
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <main class="screen">
    <div id="backdrop" class="backdrop">
      <div id="slides" class="slides"></div>
      <!-- Two stacked <video> layers are created here by app.js: one plays while the
           other preloads the next clip, so videos run back to back with no gap. -->
      <div id="videos" class="videos"></div>
      <div class="dim"></div>
    </div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grain"></div>

    <div class="content">
      <span class="kicker">LOADING <span id="progress-percent" class="percent">0%</span></span>
      <h1 id="server-name" class="server-name">
        <span class="rail"></span>Roleplay Server Name
      </h1>
      <p id="tip" class="tip"></p>
      <p id="progress-status" class="status"></p>
    </div>

    <!-- Hidden until a playlist is configured, and mouse-only: a loadscreen
         gets no keyboard focus, so every control has to be clickable. -->
    <div id="music" class="music" hidden>
      <div class="music-now">
        <span class="music-label">NOW PLAYING</span>
        <span id="music-title" class="music-title"></span>
        <span id="music-artist" class="music-artist"></span>
      </div>
      <div class="music-controls">
        <button id="music-toggle" class="music-button music-toggle" type="button" aria-label="Pause">
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <button id="music-next" class="music-button" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12l8-6zM16 6h2v12h-2z" fill="currentColor"/></svg>
        </button>
        <button id="music-mute" class="music-button music-mute" type="button" aria-label="Mute">
          <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3L11 6v12l-4-3.5H4z" fill="currentColor"/>
            <path d="M14.5 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="icon-silent" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3L11 6v12l-4-3.5H4z" fill="currentColor"/>
            <path d="M15 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="music-volume" class="music-volume" type="range" min="0" max="100" step="1" value="30" aria-label="Volume" />
      </div>
      <span id="music-hint" class="music-hint" hidden>Press play to start the music</span>
    </div>

    <!-- Mute/unmute for the playlist's sound. Shown only when a clip can make sound
         and Config.media.videoSoundButton is on. Also the way to turn sound on if
         the browser refused to autoplay it. -->
    <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Mute" hidden>
      <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3L11 6v12l-4-3.5H4z" fill="currentColor"/>
        <path d="M14.5 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon-silent" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3L11 6v12l-4-3.5H4z" fill="currentColor"/>
        <path d="M15 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="progress">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </main>
  <script>
    (() => {
      const root = document.querySelector(".screen");
      const resize = () => {
        const scale = Math.min(2, Math.max(0.5, Math.min(window.innerWidth / 1920, window.innerHeight / 1080)));
        root.style.width = `${window.innerWidth / scale}px`;
        root.style.height = `${window.innerHeight / scale}px`;
        root.style.transform = `scale(${scale})`;
        root.style.transformOrigin = "top left";
      };
      resize();
      window.addEventListener("resize", resize);
    })();
  </script>
  <script src="app.js?v=16"></script>
</body>
</html>
